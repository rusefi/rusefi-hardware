
pins:
  - pin: 4-1
    function: 12V supply from main relay (Valvetronic, X60004-1)
    type: 12v

  - pin: 4-2
    function: 12V supply from main relay (Valvetronic, X60004-2)
    type: 12v

  - pin: 4-3
    function: Valvetronic motor terminal 2 (X60004-3)
    type: etb

  - pin: 4-4
    function: Valvetronic motor terminal 1 (X60004-4)
    type: etb

  - pin: 4-5
    function: Valvetronic motor terminal 2 (X60004-5)
    type: etb

  - pin: 4-6
    function: Valvetronic motor terminal 1 (X60004-6)
    type: etb

  - pin: 6-1
    function: Ignition coil 1 primary control (power ignition driver required)
    type: ls
    class: outputs

  - pin: 6-2
    function: Ignition coil 2 primary control (power ignition driver required)
    type: ls
    class: outputs

  - pin: 6-3
    function: Ignition coil 3 primary control (power ignition driver required)
    type: ls
    class: outputs

  - pin: 6-4
    function: Ignition coil 4 primary control (power ignition driver required)
    type: ls
    class: outputs

  - pin: 6-5
    function: Ignition coil 5 primary control (power ignition driver required)
    type: ls
    class: outputs

  - pin: 6-6
    function: Ignition coil 6 primary control (power ignition driver required)
    type: ls
    class: outputs

  - pin: 5-4
    function: Hot-film air mass meter signal or neutral sensor terminal 3 (equipment dependent)

  - pin: 5-5
    function: Neutral sensor terminal 4 (ground assignment unconfirmed; JP3)

  - pin: 5-6
    function: Neutral sensor terminal 2 (interface unspecified)

  - pin: 5-12
    function: Engine breather heating relay control
    type: ls

  - pin: 5-13
    function: Main relay control output (DME relay)
    type: ls
    class: outputs

  - pin: 5-14
    function: 5V Sensor Supply (TPS, throttle actuator terminal 2)
    type: 5v

  - pin: 5-15
    function: Electronic throttle motor terminal 3
    type: etb

  - pin: 5-16
    function: Electronic throttle motor terminal 5
    type: etb

  - pin: 5-18
    function: DISA actuator 2 control (actuator terminal 1)

  - pin: 5-19
    function: Knock sensor 1 signal (cylinders 1-3)

  - pin: 5-20
    function: Knock sensor 2 signal (cylinders 4-6)

  - pin: 5-23
    function: Fuel tank vent valve control
    type: ls

  - pin: 5-25
    function: Mass air flow sensor terminal 2 (equipment dependent)

  - pin: 5-26
    function: Mass air flow sensor terminal 1 (equipment dependent)

  - pin: 5-27
    function: GNDA Analog/Sensor Ground (IAT, separate sensor or air mass meter terminal 4)
    type: agnd

  - pin: 5-28
    function: IAT Sensor Input (separate sensor or air mass meter terminal 5)
    type: at

  - pin: 5-29
    function: Crankshaft position sensor input
    type: hall

  - pin: 5-30
    function: GNDA Analog/Sensor Ground (crankshaft position sensor)
    type: agnd

  - pin: 5-31
    function: 5V Sensor Supply (MAP)
    type: 5v

  - pin: 5-32
    function: GNDA Analog/Sensor Ground (MAP)
    type: agnd

  - pin: 5-33
    function: MAP sensor input
    type: av

  - pin: 5-35
    function: BSD bus - oil condition sensor / charging system

  - pin: 5-36
    function: Universal analog input. Suggested TPS 1 sensor input (throttle actuator terminal 4)
    type: av

  - pin: 5-37
    function: Universal analog input. Suggested TPS 2 sensor input (throttle actuator terminal 1)
    type: av

  - pin: 5-38
    function: GNDA Analog/Sensor Ground (TPS, throttle actuator terminal 6)
    type: agnd

  - pin: 5-40
    function: DISA actuator 1 control (actuator terminal 1)

  - pin: 5-41
    function: GNDA Analog/Sensor Ground (knock sensor 1, cylinders 1-3)
    type: agnd

  - pin: 5-42
    function: GNDA Analog/Sensor Ground (knock sensor 2, cylinders 4-6)
    type: agnd

  - pin: 7-1
    function: Injector 1
    type: inj
    class: outputs

  - pin: 7-2
    function: Injector 2
    type: inj
    class: outputs

  - pin: 7-3
    function: Injector 3
    type: inj
    class: outputs

  - pin: 7-4
    function: ECT CLT Coolant Sensor Input
    type: at

  - pin: 7-5
    function: Intake VANOS solenoid control
    type: ls
    class: outputs

  - pin: 7-6
    function: Eccentric shaft sensor terminal 8

  - pin: 7-7
    function: Eccentric shaft sensor terminal 3

  - pin: 7-8
    function: Eccentric shaft sensor terminal 7

  - pin: 7-9
    function: Eccentric shaft sensor terminal 9

  - pin: 7-10
    function: Eccentric shaft sensor shield (terminal 4)

  - pin: 7-11
    function: Intake camshaft position sensor input
    type: hall

  - pin: 7-12
    function: Exhaust camshaft position sensor input
    type: hall

  - pin: 7-13
    function: Oil pressure switch input
    type: din

  - pin: 7-14
    function: Injector 4
    type: inj
    class: outputs

  - pin: 7-15
    function: Injector 5
    type: inj
    class: outputs

  - pin: 7-16
    function: Injector 6
    type: inj
    class: outputs

  - pin: 7-17
    function: GNDA Analog/Sensor Ground (ECT CLT coolant sensor)
    type: agnd

  - pin: 7-18
    function: Exhaust VANOS solenoid control
    type: ls
    class: outputs

  - pin: 7-19
    function: Map-controlled thermostat heater control
    type: ls

  - pin: 7-20
    function: GNDA Analog/Sensor Ground (eccentric shaft sensor terminal 5)
    type: agnd

  - pin: 7-21
    function: Eccentric shaft sensor supply (terminal 6; JP7 can select 5V)

  - pin: 7-22
    function: Eccentric shaft sensor terminal 1

  - pin: 7-23
    function: Valvetronic relay control
    type: ls

  - pin: 7-24
    function: GNDA Analog/Sensor Ground (intake camshaft position sensor)
    type: agnd

  - pin: 7-25
    function: GNDA Analog/Sensor Ground (exhaust camshaft position sensor)
    type: agnd

  - pin: 7-26
    function: BSD bus - electric coolant pump

