pins:
  - pin: 1-1
    function: CAN bus Low
    type: can

  - pin: 1-2
    function: Start request input
    type: din

  - pin: 1-3
    function: BSD bus - alternator

  - pin: 1-4
    function: Brake light switch input (X60001-4)
    type: din

  - pin: 1-5
    function: Exhaust flap control

  - pin: 1-6
    function: GNDA Analog/Sensor Ground (radiator outlet temperature sensor)
    type: agnd

  - pin: 1-7
    function: Universal analog input. Suggested PPS input 2 (pedal terminal 6)
    type: av

  - pin: 1-8
    function: Electric cooling fan control signal

  - pin: 1-9
    function: Cooling fan activation

  - pin: 1-10
    function: GNDA Analog/Sensor Ground (PPS 2, pedal terminal 1)
    type: agnd

  - pin: 1-11
    function: 5V Sensor Supply (PPS 2, pedal terminal 5)
    type: 5v

  - pin: 1-13
    function: Secondary air pump relay control
    type: ls

  - pin: 1-14
    function: CAN bus High
    type: can

  - pin: 1-15
    function: Vehicle immobilizer signal

  - pin: 1-16
    function: Brake light switch input (X60001-16)
    type: din

  - pin: 1-17
    function: Rear wheel speed input
    type: din

  - pin: 1-18
    function: Clutch switch input
    type: din

  - pin: 1-19
    function: Radiator outlet temperature sensor input
    type: at

  - pin: 1-20
    function: Universal analog input. Suggested PPS input 1 (pedal terminal 4)
    type: av

  - pin: 1-21
    function: Tachometer output (TD signal)

  - pin: 1-22
    function: Ignition Switch / Battery Voltage Analog Input (terminal 15)
    type: 12v

  - pin: 1-23
    function: GNDA Analog/Sensor Ground (PPS 1, pedal terminal 2)
    type: agnd

  - pin: 1-24
    function: 5V Sensor Supply (PPS 1, pedal terminal 3)
    type: 5v

  - pin: 1-26
    function: E-box fan control

  - pin: 2-1
    function: Wake-up supply
    type: 12v

  - pin: 2-2
    function: Brake vacuum sensor return (verify equipment variant)

  - pin: 2-5
    function: WBO2 calibration resistor (sensor terminal 5; dedicated wideband controller)

  - pin: 2-6
    function: WBO1 pump current Ip (sensor terminal 1; dedicated wideband controller)

  - pin: 2-7
    function: WBO2 pump current Ip (sensor terminal 1; dedicated wideband controller)

  - pin: 2-8
    function: WBO1 Nernst voltage Vs/Un (sensor terminal 6; dedicated wideband controller)

  - pin: 2-9
    function: WBO2 Nernst voltage Vs/Un (sensor terminal 6; dedicated wideband controller)

  - pin: 2-10
    function: WBO1 virtual ground Vm (sensor terminal 2; do not connect to chassis ground)

  - pin: 2-11
    function: WBO2 virtual ground Vm (sensor terminal 2; do not connect to chassis ground)

  - pin: 2-12
    function: WBO1 heater negative (sensor terminal 3; wideband controller heater output)
    type: ls

  - pin: 2-13
    function: WBO2 heater negative (sensor terminal 3; wideband controller heater output)
    type: ls

  - pin: 2-14
    function: Brake vacuum sensor supply (verify voltage)

  - pin: 2-15
    function: Brake vacuum sensor signal or crankshaft breather heater control (equipment dependent)

  - pin: 2-16
    function: Fuel tank leak diagnostic module control (terminal 4)

  - pin: 2-17
    function: Fuel tank leak diagnostic module control (terminal 1)

  - pin: 2-18
    function: WBO1 calibration resistor (sensor terminal 5; dedicated wideband controller)

  - pin: 2-19
    function: Post-cat oxygen sensor 2 signal (sensor terminal 4)
    type: av

  - pin: 2-20
    function: Post-cat oxygen sensor 1 signal (sensor terminal 4)
    type: av

  - pin: 2-21
    function: Anti-theft system signal (not routed by this adapter)

  - pin: 2-23
    function: GNDA Analog/Sensor Ground (post-cat oxygen sensor 1, terminal 3)
    type: agnd

  - pin: 2-24
    function: GNDA Analog/Sensor Ground (post-cat oxygen sensor 2, terminal 3)
    type: agnd

  - pin: 2-25
    function: Post-cat oxygen sensor 2 heater negative (sensor terminal 2)
    type: ls

  - pin: 2-26
    function: Post-cat oxygen sensor 1 heater negative (sensor terminal 2)
    type: ls

  - pin: 3-1
    function: 12V Battery Supply (constant, terminal 30)
    type: 12v

  - pin: 3-2
    function: 12V supply from main relay (switched, terminal 87)
    type: 12v

  - pin: 3-3
    function: Power/Chassis GND ground (X60003-3)
    type: gnd

  - pin: 3-4
    function: Power/Chassis GND ground (X60003-4)
    type: gnd

  - pin: 3-5
    function: Power/Chassis GND ground (X60003-5)
    type: gnd

  - pin: 3-6
    function: Power/Chassis GND ground (X60003-6)
    type: gnd

